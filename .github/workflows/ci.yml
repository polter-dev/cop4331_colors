name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install tools
        run: npm ci

      - name: Check HTML, CSS, and JavaScript
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: COP4331
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install tools
        run: npm ci

      - name: Run front-end unit tests
        run: npm run test:unit

      - name: Load test database
        run: mysql -h 127.0.0.1 -u root < tests/integration/setup.sql

      - name: Point the API at the test database
        run: |
          cat > api/config.php <<'EOF'
          <?php
            $dbHost = "127.0.0.1";
            $dbUser = "root";
            $dbPass = "";
            $dbName = "COP4331";
          ?>
          EOF

      - name: Start the PHP API
        run: |
          php -S 127.0.0.1:8000 -t api &
          sleep 2

      - name: Run API integration tests
        run: npm run test:integration
